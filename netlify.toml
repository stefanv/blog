[build]
  publish = "public"
  command = """\
    curl -sSL https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz \
      | tar -xz -C ${HOME} && \
    export PATH=${HOME}/dart-sass:${PATH} && \
    make html \
  """

[build.environment]
  HUGO_VERSION = "0.169.0"
  DART_SASS_VERSION = "1.108.0"
