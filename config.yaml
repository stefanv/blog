baseURL: "https://mentat.za.net/blog/"
locale: "en-US"
title: "Stéfan's blog"
theme:
  - "hugo-atom-layout"
  - "tale-hugo"
disqusShortname: "stefanvdwalt"
disableKinds: ["RSS"]

markup:
  highlight:
    style: "witchhazel"
    noClasses: false
  goldmark:
    renderHooks:
      image:
        useEmbedded: fallback
      link:
        useEmbedded: fallback
    renderer:
      unsafe: true

frontmatter:
  date: [":filename", ":default"]
  publishDate: [":filename"]

params:
  toc: true
  css: ["custom.css", "witchhazel.css"]
  atom:
    sections: ["posts", "personal"]
  comments: true
  author:
    name: "Stéfan van der Walt"

permalinks:
  posts: "/:year/:month/:day/:slug/"
  personal: "/:year/:month/:day/:slug/"

outputs:
  home: ["html", "atom"]
  section: ["html", "atom"]
  term: ["html", "atom"]

security:
  allowContent: ["! ^text/html$"]
